name: 새록 사전 배포

on:
  push:
    branches: [main]
    paths:
      - "fruits/17-saerok-dictionary/web/**"
      - ".github/workflows/saerok-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: saerok-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fruits/17-saerok-dictionary/web
      - id: deployment
        uses: actions/deploy-pages@v4
