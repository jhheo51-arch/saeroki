name: 새록이 성장

on:
  schedule:
    - cron: "0 15 * * *" # 매일 서울 자정
  push:
    branches: [main]
    paths-ignore:
      - "assets/saeroki-tree.svg"
      - "assets/saeroki-stages.svg"
      - "assets/saeroki-hero.svg"
      - "data/growth.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saeroki-grow
  cancel-in-progress: false

jobs:
  check-access:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 전체 저장소 방문 및 작업량 접근 확인
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from growth import _get_json, fetch_traffic, fetch_owner_commit_shas, list_owned_repos, read_repo_commits

          token = os.environ['TRAFFIC_TOKEN']
          repos = list_owned_repos('jhheo51-arch', token)
          private = _get_json('https://api.github.com/user/repos?affiliation=owner&visibility=private&per_page=1', token)
          if not private:
              raise RuntimeError('비공개 저장소가 보이지 않습니다. 토큰의 All repositories 범위를 확인하세요.')
          for index, repo in enumerate(repos, start=1):
              try:
                  fetch_traffic(repo, token)
              except Exception as error:
                  raise RuntimeError(f'저장소 {index}/{len(repos)} 방문 권한 확인 실패: {type(error).__name__}') from None
          with TemporaryDirectory() as directory:
              repo = private[0]['full_name']
              try:
                  shas = fetch_owner_commit_shas(repo, 'jhheo51-arch', token)
                  read_repo_commits(repo, shas, Path(directory), 'jhheo51-arch', token)
              except Exception as error:
                  raise RuntimeError(f'비공개 저장소 작업량 권한 확인 실패: {type(error).__name__}') from None
          print(f'계정 소유 저장소 {len(repos)}개 접근 확인. 비공개 저장소 포함.')
          PY
  grow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 성장 상태 갱신
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python growth.py
      - name: 바뀐 그림 커밋
        run: |
          git config user.name "saeroki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/saeroki-hero.svg assets/saeroki-tree.svg assets/saeroki-stages.svg data/growth.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: grow saeroki"
            git push
          fi
