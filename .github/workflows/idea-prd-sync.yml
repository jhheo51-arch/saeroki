name: 심사단 PRD 버전 맞춤

on:
  push:
    branches: [main]
    paths:
      - "docs/PRD-v*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saerok-idea-prd-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 검토관 PRD 버전에 맞추기
        run: python scripts/sync_idea_prd.py
      - name: 바뀐 이름·링크 커밋
        run: |
          git config user.name "saeroki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs README.md CLAUDE.md AGENTS.md fruits/*/README.md
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: sync saerok-idea PRD"
            git pull --rebase
            git push
          fi
