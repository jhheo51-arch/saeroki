[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saerok-idea"
version = "0.1.0"
description = "새록 심사단: 아이디어 심사 결과를 검증·판정하고 손익분기를 계산하는 새록이 20번 열매"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# 심사 화면의 Claude API 키를 Windows 자격 증명 관리자에 보관합니다. 없으면 실행 중 메모리에만 둡니다.
keyring = ["keyring>=24"]

[project.scripts]
saerok-idea = "saerok_idea.cli:main"

[tool.setuptools]
packages = ["saerok_idea"]
